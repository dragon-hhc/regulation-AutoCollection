<tr><th>發文字號：</th><td>個人資料保護委員會籌備處 115.01.23 個資籌法字第1150000083號</td></tr>
<tr><th>發文日期：</th><td>民國 115 年 01 月 23 日</td></tr>
<tr><th>要　　旨：</th><td>個人資料保護法所稱個人，僅指現生存之自然人而言，故涉及動物病歷資訊、動物疾病名之部分，尚無個人資料保護法之適用。</td></tr>
</table>
<a href="#">相關法條</a>
<div class="content">
<p>主旨：為貴處函詢獸醫診療機構與民眾因動物醫療衍生糾紛，於官方公開社群平臺張貼文字與影像內容，是否涉及違反個人資料保護法（下稱個資法）之疑義一案，復如說明二、三，請查照。</p>
<p>說明：</p>
<p>一、復貴處 115 年 1 月 8 日高市動保行字第 11570029800 號函。</p>

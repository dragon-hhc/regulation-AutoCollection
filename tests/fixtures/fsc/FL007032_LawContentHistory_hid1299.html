<html><head><meta charset="utf-8"></head>

<div id="AC">
<table>
<tr><th>法規名稱：</th><td>公開發行公司年報應行記載事項準則</td></tr>
<tr><th>歷史法規：</th><td>民國 114 年 11 月 07 日</td></tr>
</table>
<div class="law-articles">
<div class="row"><div class="col-no">第 1 條</div>
<div class="col-data"><div>本準則依證券交易法（以下簡稱本法）第三十六條第四項規定訂定之。</div></div></div>
<div class="row"><div class="col-no">第 2 條</div>
<div class="col-data"><div>公開發行公司年報之記載事項，除銀行、票券金融公司、金融控股公司及其他目的事業主管機關另有規定者外，應依本準則之規定全部刊</div></div></div>
</div>
</div>
